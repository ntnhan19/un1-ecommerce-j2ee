<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header}"></head>
<body>
    <div th:replace="~{fragments/sidebar :: sidebar('categories')}"></div>
    
    <div class="main-content">
        <nav th:replace="~{fragments/header :: navbar}"></nav>
        
        <div class="container-fluid mt-4 mb-5">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold m-0 text-primary"><i class="bi bi-tags"></i> Quản lý Danh mục</h2>
                <div class="d-flex gap-2">
                    <nav aria-label="breadcrumb" class="me-3 d-none d-md-block">
                        <ol class="breadcrumb m-0 mt-2">
                            <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}">Dashboard</a></li>
                            <li class="breadcrumb-item active">Categories</li>
                        </ol>
                    </nav>
                    <a th:href="@{/admin/categories/new}" class="btn btn-primary d-flex align-items-center gap-2 px-4 shadow-sm border-0 py-2 rounded-pill">
                        <i class="bi bi-plus-lg"></i> Thêm mới
                    </a>
                </div>
            </div>

            <!-- Danh sách Category -->
            <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
                <div class="bg-primary text-white p-3">
                    <h5 class="m-0">Tất cả Danh mục</h5>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="bg-light text-muted small">
                                <tr>
                                    <th class="ps-4 py-3">ID</th>
                                    <th class="py-3">DANH MỤC</th>
                                    <th class="py-3">MÔ TẢ</th>
                                    <th class="py-3 text-center">SỐ SẢN PHẨM</th>
                                    <th class="py-3 text-end pe-4">THAO TÁC</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="cat : ${categories}">
                                    <td class="ps-4 fw-bold text-muted" th:text="${cat.id}">1</td>
                                    <td>
                                        <span class="fw-bold text-dark" th:text="${cat.name}">Category Name</span>
                                    </td>
                                    <td>
                                        <small class="text-muted" th:text="${cat.description != null ? #strings.abbreviate(cat.description, 80) : 'Chưa có mô tả'}">Desc...</small>
                                    </td>
                                    <td class="text-center">
                                        <span class="badge bg-soft-primary text-primary px-3 rounded-pill" th:text="${cat.products != null ? cat.products.size() : 0}">0</span>
                                    </td>
                                    <td class="text-end pe-4">
                                        <a th:href="@{/admin/categories/edit/{id}(id=${cat.id})}" class="btn btn-soft-primary btn-sm rounded-circle me-2 px-2" title="Sửa">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <form th:action="@{/admin/categories/delete/{id}(id=${cat.id})}" method="post" class="d-inline">
                                            <button type="submit" class="btn btn-soft-danger btn-sm rounded-circle px-2" 
                                                    onclick="return confirm('Bạn có chắc chắn muốn xóa?')">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(categories)}">
                                    <td colspan="5" class="text-center py-5">
                                        <i class="bi bi-inbox fs-1 text-muted d-block mb-3"></i>
                                        <span class="text-muted fs-5">Chưa có danh mục nào. Hãy thêm mới!</span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
