<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header}"></head>

<body>
    <div th:replace="~{fragments/sidebar :: sidebar('categories')}"></div>

    <div class="main-content">
        <nav th:replace="~{fragments/header :: navbar}"></nav>

        <div class="container-fluid mt-4 mb-5">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold m-0 text-primary"><i class="bi bi-tags me-2"></i>Quản lý Danh mục</h2>
                    <nav aria-label="breadcrumb" class="mt-1">
                        <ol class="breadcrumb mb-0 small">
                            <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}">Dashboard</a></li>
                            <li class="breadcrumb-item active">Danh mục</li>
                        </ol>
                    </nav>
                </div>
                <a th:href="@{/admin/categories/new}"
                    class="btn btn-primary d-flex align-items-center gap-2 px-4 shadow-sm border-0 py-2 rounded-pill">
                    <i class="bi bi-plus-lg"></i> Thêm danh mục
                </a>
            </div>

            <!-- Flash messages -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show rounded-3 shadow-sm"
                role="alert">
                <i class="bi bi-check-circle me-2"></i>
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show rounded-3 shadow-sm"
                role="alert">
                <i class="bi bi-exclamation-triangle me-2"></i>
                <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Category list -->
            <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
                <div class="bg-primary text-white p-3 d-flex justify-content-between align-items-center">
                    <h5 class="m-0"><i class="bi bi-list-ul me-2"></i>Tất cả Danh mục</h5>
                    <span class="badge bg-white text-primary fw-bold"
                        th:text="${#lists.size(categories)} + ' danh mục'">0 danh mục</span>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="bg-light text-muted small">
                                <tr>
                                    <th class="ps-4 py-3" style="width:60px;">ID</th>
                                    <th class="py-3">DANH MỤC</th>
                                    <th class="py-3">MÔ TẢ</th>
                                    <th class="py-3 text-center" style="width:130px;">SỐ SẢN PHẨM</th>
                                    <th class="py-3 text-end pe-4" style="width:130px;">THAO TÁC</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="cat : ${categories}">
                                    <td class="ps-4 fw-bold text-muted" th:text="${cat.id}">1</td>
                                    <td>
                                        <div class="d-flex align-items-center gap-2">
                                            <div class="rounded-circle bg-primary bg-opacity-10 d-flex align-items-center justify-content-center"
                                                style="width:36px; height:36px; flex-shrink:0;">
                                                <i class="bi bi-tag text-primary" style="font-size:0.85rem;"></i>
                                            </div>
                                            <span class="fw-semibold text-dark" th:text="${cat.name}">Category
                                                Name</span>
                                        </div>
                                    </td>
                                    <td>
                                        <small class="text-muted" th:text="${cat.description != null and !#strings.isEmpty(cat.description)
                                                           ? #strings.abbreviate(cat.description, 90)
                                                           : 'Chưa có mô tả'}">Desc...</small>
                                    </td>
                                    <td class="text-center">
                                        <span class="badge rounded-pill px-3 py-2"
                                            th:classappend="${(cat.products != null ? cat.products.size() : 0) > 0 ? 'bg-primary' : 'bg-secondary bg-opacity-25 text-secondary'}"
                                            th:text="${cat.products != null ? cat.products.size() : 0} + ' sp'">0
                                            sp</span>
                                    </td>
                                    <td class="text-end pe-4">
                                        <a th:href="@{/admin/categories/edit/{id}(id=${cat.id})}"
                                            class="btn btn-sm btn-outline-primary rounded-circle me-1 px-2"
                                            title="Chỉnh sửa">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <form th:action="@{/admin/categories/delete/{id}(id=${cat.id})}" method="post"
                                            class="d-inline">
                                            <button type="submit"
                                                class="btn btn-sm btn-outline-danger rounded-circle px-2" title="Xóa"
                                                th:onclick="'return confirmDelete(\'' + ${cat.name} + '\', ' + (${cat.products != null ? cat.products.size() : 0}) + ')'">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(categories)}">
                                    <td colspan="5" class="text-center py-5">
                                        <i class="bi bi-inbox fs-1 text-muted d-block mb-3"></i>
                                        <span class="text-muted fs-5 d-block">Chưa có danh mục nào.</span>
                                        <a th:href="@{/admin/categories/new}"
                                            class="btn btn-primary mt-3 rounded-pill px-4">
                                            <i class="bi bi-plus-lg me-1"></i> Thêm danh mục đầu tiên
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function confirmDelete(name, productCount) {
            if (productCount > 0) {
                return confirm(`Danh mục "${name}" đang có ${productCount} sản phẩm.\nBạn có chắc muốn xóa không? Các sản phẩm sẽ mất liên kết danh mục.`);
            }
            return confirm(`Bạn có chắc muốn xóa danh mục "${name}"?`);
        }
    </script>
</body>

</html>
