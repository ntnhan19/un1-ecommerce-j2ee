<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header}"></head>
<body>
    <div th:replace="~{fragments/sidebar :: sidebar('products')}"></div>
    
    <div class="main-content">
        <nav th:replace="~{fragments/header :: navbar}"></nav>
        
        <div class="container-fluid mt-4 mb-5">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold m-0 text-primary"><i class="bi bi-box-seam"></i> Quản lý Sản phẩm</h2>
                <a th:href="@{/admin/products/new}" class="btn btn-primary d-flex align-items-center gap-2 px-4 shadow-sm border-0 py-2 rounded-pill">
                    <i class="bi bi-plus-lg"></i> Thêm mới
                </a>
            </div>
            
            <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
                <div class="bg-primary text-white p-3">
                    <h5 class="m-0">Danh sách Sản phẩm</h5>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="bg-light">
                                <tr>
                                    <th class="ps-4">ID</th>
                                    <th>Hình ảnh</th>
                                    <th>Tên sản phẩm</th>
                                    <th>Danh mục</th>
                                    <th>Giá</th>
                                    <th>Tồn kho</th>
                                    <th class="text-end pe-4">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="p : ${products}">
                                    <td class="ps-4" th:text="${p.id}">1</td>
                                    <td>
                                        <img th:if="${p.imageUrls != null and !p.imageUrls.empty}" th:src="${p.imageUrls[0]}" 
                                             class="rounded-3 shadow-sm" style="width: 50px; height: 50px; object-fit: cover;" alt="Product">
                                        <div th:unless="${p.imageUrls != null and !p.imageUrls.empty}" 
                                             class="bg-light rounded-3 d-flex align-items-center justify-content-center" 
                                             style="width: 50px; height: 50px;">
                                            <i class="bi bi-image text-muted"></i>
                                        </div>
                                    </td>
                                    <td>
                                        <div class="fw-bold" th:text="${p.name}">Product Name</div>
                                        <div class="small text-muted" th:text="${p.description != null ? #strings.abbreviate(p.description, 40) : 'Chưa có mô tả'}">Desc...</div>
                                    </td>
                                    <td>
                                        <span class="badge bg-light text-dark border px-3 py-2 rounded-pill" th:text="${p.categoryName != null ? p.categoryName : 'N/A'}">Category</span>
                                    </td>
                                    <td class="fw-bold text-primary" th:text="${#numbers.formatCurrency(p.price)}">$0.00</td>
                                    <td>
                                        <span th:class="${p.stock > 10 ? 'text-success' : 'text-danger'}" th:text="${p.stock}">0</span>
                                    </td>
                                    <td class="text-end pe-4">
                                        <div class="btn-group">
                                            <a th:href="@{/admin/products/edit/{id}(id=${p.id})}" class="btn btn-sm btn-outline-primary rounded-circle me-2" title="Sửa">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                            <form th:action="@{/admin/products/delete/{id}(id=${p.id})}" method="post" 
                                                  onsubmit="return confirm('Bạn có chắc chắn muốn xóa sản phẩm này?');" style="display: inline;">
                                                <button type="submit" class="btn btn-sm btn-outline-danger rounded-circle" title="Xóa">
                                                    <i class="bi bi-trash"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${products.empty}">
                                    <td colspan="7" class="text-center py-5">
                                        <i class="bi bi-inbox fs-1 text-muted d-block mb-3"></i>
                                        <span class="text-muted fs-5">Chưa có sản phẩm nào được tạo.</span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
