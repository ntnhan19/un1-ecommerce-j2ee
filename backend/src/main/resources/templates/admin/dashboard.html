<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header}"></head>
<body>
    <div th:replace="~{fragments/sidebar :: sidebar('dashboard')}"></div>
    
    <div class="main-content">
        <nav th:replace="~{fragments/header :: navbar}"></nav>
        
        <div class="container-fluid mt-4 mb-5">
            <h2 class="mb-4 fw-bold">Dashboard Tổng quan</h2>
            
            <div class="row g-4 mb-5">
                <!-- Stat Cards -->
                <div class="col-md-3">
                    <div class="card stat-card border-start border-4 border-primary">
                        <div class="card-body">
                            <h6 class="text-muted text-uppercase mb-2">Tổng sản phẩm</h6>
                            <h3 class="fw-bold mb-0" th:text="${totalProducts}">1,234</h3>
                            <div class="mt-2 text-primary">
                                <i class="bi bi-box-seam me-1"></i> <span class="small">Sản phẩm hiện tại</span>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="col-md-3">
                    <div class="card stat-card border-start border-4 border-success">
                        <div class="card-body">
                            <h6 class="text-muted text-uppercase mb-2">Tổng đơn hàng</h6>
                            <h3 class="fw-bold mb-0" th:text="${totalOrders}">85</h3>
                            <div class="mt-2 text-success">
                                <i class="bi bi-check-circle me-1"></i> <span class="small">Xác nhận</span>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="col-md-3">
                    <div class="card stat-card border-start border-4 border-info">
                        <div class="card-body">
                            <h6 class="text-muted text-uppercase mb-2">Người dùng</h6>
                            <h3 class="fw-bold mb-0" th:text="${totalUsers}">560</h3>
                            <div class="mt-2 text-info">
                                <i class="bi bi-people me-1"></i> <span class="small">Thành viên</span>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="col-md-3">
                    <div class="card stat-card border-start border-4 border-warning">
                        <div class="card-body">
                            <h6 class="text-muted text-uppercase mb-2">Tổng doanh thu</h6>
                            <h3 class="fw-bold mb-0" th:text="${#numbers.formatCurrency(totalRevenue)}">$0.00</h3>
                            <div class="mt-2 text-warning">
                                <i class="bi bi-currency-dollar me-1"></i> <span class="small">Tổng hợp</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Quick Actions -->
            <div class="mt-5">
                <h5 class="mb-3 fw-bold">Thao tác nhanh</h5>
                <div class="d-flex gap-3">
                    <a th:href="@{/admin/products/new}" class="btn btn-primary d-flex align-items-center gap-2 px-4 py-2 rounded-3">
                        <i class="bi bi-plus-lg"></i> Thêm sản phẩm mới
                    </a>
                    <a th:href="@{/admin/orders}" class="btn btn-outline-success d-flex align-items-center gap-2 px-4 py-2 rounded-3">
                        <i class="bi bi-card-checklist"></i> Kiểm tra đơn hàng
                    </a>
                </div>
            </div>
            
        </div>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
