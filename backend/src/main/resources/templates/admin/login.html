<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - UN1 E-Commerce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f3f4f6;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            border: none;
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            background: white;
        }
        .btn-primary {
            background: #4f46e5;
            border: none;
            padding: 0.8rem;
            border-radius: 0.8rem;
            font-weight: 600;
        }
        .btn-primary:hover {
            background: #4338ca;
        }
        .form-control {
            padding: 0.8rem 1rem;
            border-radius: 0.8rem;
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
        }
        .form-control:focus {
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
            border-color: #4f46e5;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <div class="bg-primary bg-opacity-10 text-primary d-inline-flex p-3 rounded-circle mb-3">
                <i class="bi bi-shield-lock-fill fs-2"></i>
            </div>
            <h3 class="fw-bold">Admin Portal</h3>
            <p class="text-muted small">Vui lòng đăng nhập với quyền Admin</p>
        </div>

        <div th:if="${param.error}" class="alert alert-danger border-0 small py-2 mb-4" role="alert">
            Email hoặc mật khẩu không chính xác.
        </div>
        <div th:if="${param.logout}" class="alert alert-success border-0 small py-2 mb-4" role="alert">
            Đã đăng xuất thành công.
        </div>

        <form th:action="@{/admin/login}" method="post">
            <div class="mb-3">
                <label class="form-label small fw-semibold">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                    <input type="email" name="username" class="form-control border-start-0 ps-0" placeholder="admin@example.com" required autofocus>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label small fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0"><i class="bi bi-key text-muted"></i></span>
                    <input type="password" name="password" class="form-control border-start-0 ps-0" placeholder="••••••••" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 shadow-sm">
                Đăng nhập ngay
            </button>
        </form>
        
        <div class="mt-4 text-center">
            <a href="/" class="small text-decoration-none text-muted">
                <i class="bi bi-arrow-left"></i> Quay lại trang chủ
            </a>
        </div>
    </div>
</body>
</html>
