<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header}"></head>
<body>
    <div th:replace="~{fragments/sidebar :: sidebar('products')}"></div>
    
    <div class="main-content">
        <nav th:replace="~{fragments/header :: navbar}"></nav>
        
        <div class="container-fluid mt-4 mb-5">
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/admin/products}">Sản phẩm</a></li>
                    <li class="breadcrumb-item active" th:text="${productId != null ? 'Chỉnh sửa' : 'Thêm mới'}">Thêm mới</li>
                </ol>
            </nav>

            <div class="card shadow-sm border-0 rounded-4 overflow-hidden mb-5">
                <div class="bg-primary text-white p-3">
                    <h5 class="m-0" th:text="${productId != null ? 'Chỉnh sửa Sản phẩm' : 'Thêm Sản phẩm mới'}">Thêm Sản phẩm</h5>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/admin/products/save}" th:object="${product}" method="post">
                        <input type="hidden" name="id" th:value="${productId}">
                        
                        <div class="row g-4">
                            <!-- Basic Info -->
                            <div class="col-md-8">
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Tên sản phẩm</label>
                                    <input type="text" th:field="*{name}" class="form-control" placeholder="Nhập tên sản phẩm..." required>
                                    <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger small mt-1"></div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Mô tả sản phẩm</label>
                                    <textarea th:field="*{description}" class="form-control" rows="8" placeholder="Nhập mô tả chi tiết..."></textarea>
                                </div>
                            </div>
                            
                            <!-- Pricing & Category -->
                            <div class="col-md-4">
                                <div class="card bg-light border-0 rounded-4 p-3 mb-4">
                                    <div class="mb-3">
                                        <label class="form-label fw-bold">Giá bán</label>
                                        <div class="input-group">
                                            <span class="input-group-text">$</span>
                                            <input type="number" th:field="*{price}" class="form-control" step="0.01" required>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label fw-bold">Số lượng tồn kho</label>
                                        <input type="number" th:field="*{stock}" class="form-control" required>
                                    </div>
                                    <div class="mb-0">
                                        <label class="form-label fw-bold">Danh mục</label>
                                        <select th:field="*{categoryId}" class="form-select" required>
                                            <option value="">-- Chọn danh mục --</option>
                                            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">Category</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <!-- List Fields (Images, Colors, Sizes) -->
                            <div class="col-12 mt-4">
                                <h5 class="border-bottom pb-2 mb-3">Thông tin chi tiết (List fields)</h5>
                                <div class="row g-4">
                                    <div class="col-md-4">
                                        <label class="form-label fw-bold">URLs Hình ảnh (Dùng dấu phẩy để tách)</label>
                                        <textarea th:field="*{imageUrls}" class="form-control" rows="3" placeholder="https://image1.jpg, https://image2.jpg..."></textarea>
                                        <small class="text-muted">Nhập danh sách Link ảnh, cách nhau bởi dấu phẩy.</small>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label fw-bold">Màu sắc (Dùng dấu phẩy để tách)</label>
                                        <textarea th:field="*{colors}" class="form-control" rows="3" placeholder="Trắng, Đen, Xanh dương..."></textarea>
                                        <small class="text-muted">Nhập các màu hiện có.</small>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label fw-bold">Kích thước (Dùng dấu phẩy để tách)</label>
                                        <textarea th:field="*{sizes}" class="form-control" rows="3" placeholder="S, M, L, XL..."></textarea>
                                        <small class="text-muted">Nhập các size hiện có.</small>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="mt-5 d-flex gap-3 justify-content-end">
                            <a th:href="@{/admin/products}" class="btn btn-light px-4 rounded-pill">Quay lại</a>
                            <button type="submit" class="btn btn-primary px-5 rounded-pill shadow-sm">Lưu Sản phẩm</button>
                        </div>
                    </form>
                </div>
            </div>

        </div>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
