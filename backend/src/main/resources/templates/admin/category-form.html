<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header}"></head>
<body>
    <div th:replace="~{fragments/sidebar :: sidebar('categories')}"></div>
    
    <div class="main-content">
        <nav th:replace="~{fragments/header :: navbar}"></nav>
        
        <div class="container-fluid mt-4 mb-5">
            <nav aria-label="breadcrumb" class="mb-4 text-primary">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/admin/categories}">Danh mục</a></li>
                    <li class="breadcrumb-item active" th:text="${category.id != null ? 'Chỉnh sửa' : 'Thêm mới'}">Thêm mới</li>
                </ol>
            </nav>

            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
                        <div class="bg-primary text-white p-3">
                            <h5 class="m-0">
                                <i th:class="${category.id != null ? 'bi bi-pencil-square me-2' : 'bi bi-plus-circle me-2'}"></i>
                                <span th:text="${category.id != null ? 'Chỉnh sửa Danh mục' : 'Thêm Danh mục mới'}">Tiêu đề</span>
                            </h5>
                        </div>
                        <div class="card-body p-4">
                            <form th:action="@{/admin/categories/save}" method="post">
                                <input type="hidden" name="id" th:value="${category.id}">
                                
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Tên danh mục</label>
                                    <input type="text" name="name" th:value="${category.name}" class="form-control" placeholder="Ví dụ: Áo thời trang" required>
                                </div>
                                
                                <div class="mb-4">
                                    <label class="form-label fw-bold">Mô tả</label>
                                    <textarea name="description" class="form-control" rows="5" th:text="${category.description}" placeholder="Mô tả ngắn gọn về danh mục..."></textarea>
                                </div>
                                
                                <div class="d-flex gap-3 justify-content-end">
                                    <a th:href="@{/admin/categories}" class="btn btn-light px-4 rounded-pill">Hủy</a>
                                    <button type="submit" class="btn btn-primary px-5 rounded-pill shadow-sm">
                                        <span th:text="${category.id != null ? 'Cập nhật' : 'Lưu danh mục'}">Lưu</span>
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
