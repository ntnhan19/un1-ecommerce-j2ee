<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header}"></head>
<body>
    <div th:replace="~{fragments/sidebar :: sidebar('orders')}"></div>
    
    <div class="main-content">
        <nav th:replace="~{fragments/header :: navbar}"></nav>
        
        <div class="container-fluid mt-4 mb-5">
            <h2 class="mb-4 fw-bold text-primary"><i class="bi bi-cart3"></i> Quản lý Đơn hàng</h2>
            
            <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
                <div class="bg-success text-white p-3">
                    <h5 class="m-0">Danh sách Đơn hàng</h5>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="bg-light">
                                <tr>
                                    <th class="ps-4">Mã đơn</th>
                                    <th>Khách hàng</th>
                                    <th>Tổng tiền</th>
                                    <th>Trạng thái</th>
                                    <th>Ngày đặt</th>
                                    <th class="ps-4">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="o : ${orders}">
                                    <td class="ps-4 fw-bold" th:text="${'#ORD-' + o.id}">1</td>
                                    <td>
                                        <div class="fw-bold" th:text="${o.fullName}">Hân Ngọc</div>
                                        <div class="small text-muted" th:text="${o.email}">han@gmail.com</div>
                                    </td>
                                    <td class="fw-bold text-success" th:text="${#numbers.formatCurrency(o.totalAmount)}">$0.00</td>
                                    <td>
                                        <span class="badge" th:classappend="${
                                            o.status.name() == 'PENDING' ? 'bg-warning text-dark' : 
                                            o.status.name() == 'PROCESSING' ? 'bg-primary' : 
                                            o.status.name() == 'SHIPPED' ? 'bg-info' : 
                                            o.status.name() == 'DELIVERED' ? 'bg-success' : 
                                            'bg-danger'}" th:text="${o.status}">Trạng thái</span>
                                    </td>
                                    <td th:text="${#temporals.format(o.createdAt, 'dd-MM-yyyy HH:mm')}">Date...</td>
                                    <td class="ps-4">
                                        <form th:action="@{/admin/orders/update-status}" method="post" class="d-flex gap-2">
                                            <input type="hidden" name="orderId" th:value="${o.id}">
                                            <select name="status" class="form-select form-select-sm border-0 bg-light" style="width: 140px;">
                                                <option th:each="st : ${statusOptions}" th:value="${st}" th:text="${st}" th:selected="${st == o.status}"></option>
                                            </select>
                                            <button type="submit" class="btn btn-sm btn-outline-success rounded-pill px-3">
                                                Cập nhật
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                                <tr th:if="${orders.empty}">
                                    <td colspan="6" class="text-center py-5">
                                        <i class="bi bi-inbox fs-1 text-muted d-block mb-3"></i>
                                        <span class="text-muted fs-5">Chưa có đơn hàng nào.</span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            
        </div>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
