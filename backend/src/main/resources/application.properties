# Server configuration
server.port=8080

# Spring active profile — dùng application-dev.yml
spring.profiles.active=dev

# Database connection (fallback nếu không dùng profile dev)
spring.datasource.url=jdbc:mysql://localhost:3306/un1_ecommerce_dev?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Ngochan1801@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate SQL logs configuration
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ddl-auto=update: tự động cập nhật / tạo bảng khi Entities có thay đổi
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# JWT Configuration
jwt.secret=UN1EcommerceSecretKeyForJWTTokenSigningMustBeAtLeast256BitsLong2024
jwt.expiration=86400000

