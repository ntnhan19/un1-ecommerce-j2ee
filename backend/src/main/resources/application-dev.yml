server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/un1_ecommerce_dev?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
    username: root
    password: [PASSWORD]
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs: 
    path: /v3/api-docs

app:
  google:
    client-id: [OAUTH_CLIENT_ID]
    secret: [OAUTH_CLIENT_SECRET]

google:
  gemini:
    api-key: [GCP_API_KEY]
    api-url: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent